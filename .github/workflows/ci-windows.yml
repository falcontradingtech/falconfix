name: CI Windows

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        choco install -y cmake ninja opencppcoverage
      shell: powershell

    - name: Setup vcpkg cache
      uses: actions/cache@v3
      with:
        path: ${{ env.VCPKG_ROOT }}
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install vcpkg
      run: |
        if (-not (Test-Path "${{ env.VCPKG_ROOT }}")) {
          git clone https://github.com/Microsoft/vcpkg.git ${{ env.VCPKG_ROOT }}
          & "${{ env.VCPKG_ROOT }}\bootstrap-vcpkg.bat"
        }
      shell: powershell

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup C++ environment
      uses: aminya/setup-cpp@v1
      with:
        compiler: msvc
        cmake: true
        ninja: true

    - name: Build with coverage flags
      run: |
        $env:VCPKG_ROOT = "${{ env.VCPKG_ROOT }}"
        & .\build.ps1 -Preset windows-release
      shell: powershell
      env:
        VCPKG_ROOT: ${{ env.VCPKG_ROOT }}

    - name: Run tests with coverage
      run: |
        # Run tests normally first
        cmake --build . --config Release
        ctest --output-on-failure -C Release

        # Run tests with OpenCppCoverage
        $openCppCoveragePath = "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe"
        $workspaceRoot = "${{ github.workspace }}"
        if (Test-Path $openCppCoveragePath) {
          & $openCppCoveragePath `
            --sources "$workspaceRoot\src" `
            --excluded_sources "$workspaceRoot\tests" `
            --excluded_sources "${{ env.VCPKG_ROOT }}" `
            --export_type "cobertura:$workspaceRoot\windows_coverage.xml" `
            -- ctest --output-on-failure -C Release
        }
      shell: powershell
      working-directory: ${{ github.workspace }}/build/windows-release

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./windows_coverage.xml
        flags: windows
        slug: falcontradingtech/falconfix
        name: windows-coverage
        fail_ci_if_error: false
        verbose: true
      env:
        NODE_OPTIONS: --no-deprecation
