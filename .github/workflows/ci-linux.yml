name: CI Linux

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake pkg-config git lcov

    - name: Setup vcpkg cache
      uses: actions/cache@v3
      with:
        path: ${{ env.VCPKG_ROOT }}
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install vcpkg
      run: |
        if [ ! -d "${{ env.VCPKG_ROOT }}" ]; then
          git clone https://github.com/Microsoft/vcpkg.git ${{ env.VCPKG_ROOT }}
          ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh
        fi

    - name: Build with coverage
      run: |
        chmod +x ./build.sh
        ./build.sh
      env:
        VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        CXXFLAGS: "--coverage"
        LDFLAGS: "--coverage"

    - name: Run tests
      run: |
        cd build/linux-release
        cmake --build . --target test --config Release

    - name: Generate coverage report
      run: |
        lcov --directory build/linux-release --capture --output-file coverage.info
        lcov --remove coverage.info '*/vcpkg/*' '*/build/*' --output-file coverage.info
        lcov --list coverage.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.info
        flags: linux
        name: linux-coverage
        fail_ci_if_error: false
